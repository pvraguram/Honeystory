<!DOCTYPE html>
<html>
<head><title>Empty Table Log</title></head>
<body>
<!-- A table with headers but zero data rows -->
<table id="empty_data">
  <thead>
    <tr>
      <th>timestamp</th>
      <th>event_type</th>
      <th>description</th>
    </tr>
  </thead>
  <tbody>
    <!-- No rows -->
  </tbody>
</table>

<!-- A completely empty table -->
<table id="totally_empty">
</table>

<!-- Valid table after the empty ones -->
<table id="valid_after_empty">
  <thead>
    <tr>
      <th>recorded_at</th>
      <th>parameter</th>
      <th>reading</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>2024-01-15T11:00:00.500</td>
      <td>ALTITUDE</td>
      <td>35000</td>
    </tr>
  </tbody>
</table>
</body>
</html>
